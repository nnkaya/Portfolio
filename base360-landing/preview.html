<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base360 · Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(0.955 0.008 300);
    --panel: oklch(0.16 0.02 285);
    --ink: oklch(0.22 0.03 285);
    --muted: oklch(0.62 0.02 285);
    --grad: linear-gradient(102deg, oklch(0.64 0.27 353), oklch(0.51 0.26 291) 92%);
    --sans: "Schibsted Grotesk", system-ui, sans-serif;
    --mono: "Spline Sans Mono", ui-monospace, monospace;
    --ease: cubic-bezier(0.22,1,0.36,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ font-family:var(--sans); background:var(--bg); display:flex; flex-direction:column; overflow:hidden; }

  /* toolbar */
  .bar{
    flex:none; display:flex; align-items:center; gap:16px;
    padding:10px 18px; background:var(--panel); color:oklch(0.96 0.01 300);
  }
  .bar .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; }
  .bar .brand .mk{ width:22px; height:22px; border-radius:6px; background:var(--grad); display:grid; place-items:center; }
  .bar .brand .mk svg{ width:13px; height:13px; }
  .bar .brand span{ color:oklch(0.75 0.14 330); }

  .seg{ margin:0 auto; display:flex; gap:4px; background:oklch(0.24 0.02 285); padding:4px; border-radius:999px; }
  .seg button{
    font-family:var(--sans); font-weight:600; font-size:13.5px; color:oklch(0.72 0.02 285);
    background:none; border:none; cursor:pointer; padding:8px 18px; border-radius:999px;
    display:flex; align-items:center; gap:8px; transition:color .2s var(--ease), background .3s var(--ease);
  }
  .seg button svg{ width:15px; height:15px; }
  .seg button.active{ color:#fff; background:linear-gradient(102deg, oklch(0.6 0.26 353), oklch(0.5 0.26 291)); box-shadow:0 4px 12px oklch(0.5 0.24 320/.4); }
  .seg button:not(.active):hover{ color:oklch(0.92 0.01 300); }

  .meta{ font-family:var(--mono); font-size:12px; color:oklch(0.62 0.02 285); min-width:96px; text-align:right; }

  /* stage */
  .stage{
    flex:1; min-height:0; display:grid; place-items:center;
    padding:22px; overflow:auto;
    background:
      radial-gradient(60vw 40vh at 80% 0%, oklch(0.93 0.04 330/.5), transparent 70%),
      var(--bg);
  }
  .device{
    background:#fff; transition:width .5s var(--ease), height .5s var(--ease), border-radius .4s var(--ease), box-shadow .4s var(--ease);
    width:100%; height:100%; border-radius:12px; overflow:hidden;
    box-shadow:0 20px 50px oklch(0.5 0.05 300/.18); border:1px solid oklch(0.9 0.01 300);
  }
  .stage.mobile .device{
    width:390px; height:min(844px, 100%); border-radius:34px;
    box-shadow:0 26px 60px oklch(0.4 0.06 300/.32); border:9px solid oklch(0.18 0.02 285);
  }
  .device iframe{ width:100%; height:100%; border:0; display:block; background:#fff; }

  @media(max-width:520px){
    .bar .brand span, .meta{ display:none; }
    .seg button{ padding:8px 14px; }
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg></span>
      base<span>360</span> preview
    </div>
    <div class="seg" role="tablist">
      <button id="btnDesktop" class="active" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Desktop
      </button>
      <button id="btnMobile" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
        Mobile
      </button>
    </div>
    <div class="meta" id="meta">1440 × auto</div>
  </div>

  <div class="stage" id="stage">
    <div class="device">
      <iframe id="frame" src="hero.html" title="Base360 landing preview"></iframe>
    </div>
  </div>

<script>
  const stage = document.getElementById("stage");
  const meta = document.getElementById("meta");
  const btnD = document.getElementById("btnDesktop");
  const btnM = document.getElementById("btnMobile");

  function setMode(mode){
    const mobile = mode === "mobile";
    stage.classList.toggle("mobile", mobile);
    btnM.classList.toggle("active", mobile);
    btnD.classList.toggle("active", !mobile);
    btnM.setAttribute("aria-pressed", mobile);
    btnD.setAttribute("aria-pressed", !mobile);
    meta.textContent = mobile ? "390 × 844" : "full × auto";
    try{ localStorage.setItem("b360-preview-mode", mode); }catch(e){}
  }

  btnD.addEventListener("click", ()=>setMode("desktop"));
  btnM.addEventListener("click", ()=>setMode("mobile"));

  // restore last choice
  let saved = "desktop";
  try{ saved = localStorage.getItem("b360-preview-mode") || "desktop"; }catch(e){}
  setMode(saved);
</script>
</body>
</html>
